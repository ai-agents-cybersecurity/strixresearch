<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - SecureBank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 SecureBank</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('transfer') }}">Transfer</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </header>
        
        <div class="form-container">
            <h2>Transfer Funds</h2>
            
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            
            <!-- VULNERABILITY: No CSRF token -->
            <form method="POST" action="{{ url_for('transfer') }}">
                <div class="form-group">
                    <label for="from_account">From Account</label>
                    <select id="from_account" name="from_account" required>
                        {% for account in accounts %}
                        <option value="{{ account.id }}">
                            {{ account.account_number }} ({{ account.account_type }}) - ${{ "%.2f" % account.balance }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="to_account">To Account Number</label>
                    <input type="text" id="to_account" name="to_account" placeholder="Enter account number" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" name="amount" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="What's this for?">
                </div>
                
                <button type="submit" class="btn btn-primary">Transfer</button>
            </form>
        </div>
    </div>
</body>
</html>
